<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects by David Li</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
</head>
<body>
    <h1 class="projects-title">Projects by David Li</h1>
    <section aria-labelledby="chart-heading">
        <h2 id="chart-heading">Projects by year</h2>
        <p id="chart-help">Select a slice or legend entry to filter by year. Select it again to show all years.</p>
        <div class="chart-container">
            <svg id="projects-pie-plot" width="320" height="320" viewBox="-50 -50 100 100" role="group" aria-labelledby="chart-heading" aria-describedby="chart-help"></svg>
            <ul class="legend" aria-label="Project years"></ul>
        </div>
        <p class="chart-empty" hidden>No projects match your search.</p>
    </section>
    <input class="searchBar" type="search" aria-label="Search projects" placeholder="Search projects…" disabled>
    <p class="projects-status" role="status"></p>
    <div class="projects" aria-live="polite"><p>Loading projects…</p></div>
</body>
</html>
